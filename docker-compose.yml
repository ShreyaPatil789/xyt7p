services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aeroprocure-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_PATH=/app/data/elexon_jan2026.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeroprocure-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
